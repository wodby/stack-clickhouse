name: clickhouse
title: ClickHouse
icon: clickhouse
docs: https://wodby.com/docs/2.0/stacks/catalog/clickhouse/

services:
- name: clickhouse
  title: ClickHouse
  service: clickhouse
  required: true
  volumes:
  - name: data
    size: 20
  workloads:
  - name: main
    containers:
    - name: clickhouse
      resources:
        request:
          cpu: 500
          memory: 1024
        limit:
          cpu: 2000
          memory: 4096
